<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault — Password Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- AUTHENTICATION CONTAINER -->
	<div id="auth-container" class="container">
		<h2>Vault</h2>

		<!-- Login Form -->
		<div id="login-form">
			<h3>Log in</h3>

			<div class="field">
				<label for="login-username">Username</label>
				<input type="text" id="login-username" placeholder="Your username">
			</div>
			<div class="field">
				<label for="login-secretkey">Secret key</label>
				<input type="password" id="login-secretkey" placeholder="Your secret key">
			</div>

			<button onclick="login()">Log in</button>
			<p>
				Don't have an account? <a href="#" onclick="toggleAuth('register')">Register here</a>
			</p>
		</div>

		<!-- Registration Form (Matches your custom fields) -->
		<div id="register-form" style="display: none;">
			<h3>Create account</h3>

			<div class="field">
				<label for="reg-name">Full name</label>
				<input type="text" id="reg-name" placeholder="Jane Doe">
			</div>
			<div class="field">
				<label for="reg-username">Username</label>
				<input type="text" id="reg-username" placeholder="Choose a username">
			</div>
			<div class="field">
				<label for="reg-email">Email address</label>
				<input type="email" id="reg-email" placeholder="you@example.com">
			</div>
			<div class="field">
				<label for="reg-gender">Gender</label>
				<select id="reg-gender">
					<option value="">Select gender</option>
					<option value="Male">Male</option>
					<option value="Female">Female</option>
					<option value="Other">Other</option>
				</select>
			</div>
			<div class="field">
				<label for="reg-dob">Date of birth</label>
				<input type="date" id="reg-dob">
			</div>
			<div class="field">
				<label for="reg-secretkey">Secret key</label>
				<input type="password" id="reg-secretkey" placeholder="Create a secret key">
			</div>

			<button onclick="register()">Create account</button>
			<p>
				Already have an account? <a href="#" onclick="toggleAuth('login')">Log in here</a>
			</p>
		</div>

		<p id="auth-message"></p>
	</div>

	<!-- MAIN DASHBOARD CONTAINER -->
	<div id="dashboard-container" class="container" style="display: none;">
		<div class="header">
			<h2 id="welcome-message"></h2>
			<button onclick="logout()" class="logout-btn">Log out</button>
		</div>
		<p>This is your password vault.</p>

		<!-- The 3 Main Dashboard Options -->
		<div id="dashboard-menu">
			<button class="menu-btn" onclick="showSection('save-section')">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
				Save a new password
			</button>
			<button class="menu-btn" onclick="showSection('show-section')">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
				Show saved passwords
			</button>
			<button class="menu-btn" onclick="showSection('generate-section')">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
				Generate a password
			</button>
		</div>

		<!-- SECTION 1: Save New Password -->
		<div id="save-section" class="sub-section" style="display: none;">
			<h3>Save a new password</h3>

			<div class="field">
				<label for="save-name">Password name</label>
				<input type="text" id="save-name" placeholder="e.g. Facebook">
			</div>
			<div class="field">
				<label for="save-pwd">Password</label>
				<input type="password" id="save-pwd" placeholder="Enter password" oninput="checkStrength()">
			</div>

			<div id="strength-meter">
				Strength: <span id="strength-text">None</span>
			</div>

			<button onclick="savePassword()">Save</button>
			<button class="secondary-btn" onclick="showSection('dashboard-menu')">Back to dashboard</button>
		</div>

		<!-- SECTION 2: Show Saved Passwords -->
		<div id="show-section" class="sub-section" style="display: none;">
			<h3>Saved passwords</h3>
			<p id="auth-prompt">Enter your secret key to view your passwords.</p>
			<div id="key-verification">
				<input type="password" id="verify-secretkey" placeholder="Enter secret key">
				<button onclick="verifyKeyAndLoadPasswords()">Verify &amp; show</button>
			</div>

			<div id="password-list-container" style="display: none;">
				<table id="password-table">
					<thead>
						<tr>
							<th>Name</th>
							<th>Password</th>
							<th>Action</th>
						</tr>
					</thead>
					<tbody id="password-list">
						<!-- Javascript injects rows here -->
					</tbody>
				</table>
			</div>
			<br>
			<button class="secondary-btn" onclick="showSection('dashboard-menu')">Back to dashboard</button>
		</div>

		<!-- SECTION 3: Generate Password -->
		<div id="generate-section" class="sub-section" style="display: none;">
			<h3>Generate a password</h3>

			<div class="field">
				<label for="gen-name">Password name</label>
				<input type="text" id="gen-name" placeholder="e.g. Reddit">
			</div>
			<div class="field">
				<label for="gen-length">Required length</label>
				<input type="number" id="gen-length" placeholder="16" min="8" max="64">
			</div>

			<button onclick="generatePassword()">Generate</button>

			<!-- Updated Result Container -->
			<div id="generated-result" style="display: none; margin-top: 15px;">
				<p>Generated password</p>
				<p><strong id="gen-output"></strong></p>
				<div style="display: flex; gap: 10px;">
					<button onclick="saveGeneratedPassword()">Add to vault</button>
					<button class="logout-btn" style="width: 100%; margin-top: 10px; text-align:center; justify-content:center;" onclick="clearGeneratedPassword()">Clear</button>
				</div>
			</div>
			<br><br>
			<button class="secondary-btn" onclick="showSection('dashboard-menu')">Back to dashboard</button>
		</div>
	</div>

	<script src="app.js"></script>
</body>
</html>
